<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Contestants</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .whatsapp-btn {
            display: block;
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #25D366;
            color: white;
            text-align: center;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }
        .whatsapp-btn:hover {
            background-color: #1EBE5D;
        }

        .profile-card {
            background: white;
            padding: 20px;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .profile-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .profile-card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid #007bff;
        }

        .profile-card h3 {
            margin: 10px 0;
            font-size: 1.5em;
            color: #333;
        }

        .profile-card p {
            margin: 5px 0;
            color: #666;
        }

        .profile-card p strong {
            color: #333;
        }

        .category-section {
            margin-bottom: 40px;
        }

        .category-section h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em;
            color: #333;
        }

        header, footer {
            background: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
            width: 100%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: opacity 0.3s, transform 0.3s;
            position: fixed;
            left: 0;
            z-index: 1000;
        }

        header {
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        footer {
            bottom: 0;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-buttons button {
            background: white;
            color: #007bff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1em;
            transition: background 0.3s;
        }

        .nav-buttons button:hover {
            background: #f0f0f0;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 100px 20px 60px; /* Adjusted padding to account for header and footer */
            margin-top: 80px; /* Ensure content is not covered by the fixed header */
        }
    </style>
</head>
<body>
    <header>
        <h1>Results</h1>
        <div class="nav-buttons">
            <button onclick="window.location.href='index.html'">Home</button>
            <button onclick="window.location.href='contestants.html'">Participants</button>
            <button onclick="window.location.href='admin.html'">Admin</button>
        </div>
    </header>
    
    <main id="resultsContainer">
        <!-- Contestant categories will be dynamically inserted here -->
    </main>
    
    <footer>
        <p>&copy; 2025 Truthwave Talent Search. All rights reserved.</p>
    </footer>
    
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const resultsContainer = document.getElementById("resultsContainer");

            try {
                // Fetch contestants data from backend
                const response = await fetch("https://contestants-api.onrender.com/contestants");
                let contestants = await response.json();

                // Group contestants by category
                const categories = {};
                contestants.forEach(contestant => {
                    if (!categories[contestant.talentCategory]) {
                        categories[contestant.talentCategory] = [];
                    }
                    categories[contestant.talentCategory].push(contestant);
                });

                // Sort contestants within each category by unique code
                Object.keys(categories).forEach(category => {
                    categories[category].sort((a, b) => a.uniqueCode.localeCompare(b.uniqueCode));
                });

                // Clear previous content
                resultsContainer.innerHTML = "";

                if (contestants.length === 0) {
                    resultsContainer.innerHTML = "<p>No contestants registered yet.</p>";
                    return;
                }

                // Display each category and its contestants
                Object.keys(categories).forEach(category => {
                    const categorySection = document.createElement("section");
                    categorySection.classList.add("category-section");
                    categorySection.innerHTML = `<h2>${category}</h2>`;
                    categories[category].forEach(contestant => {
                        const card = document.createElement("div");
                        card.classList.add("profile-card");
                        card.innerHTML = `
                            <img src="${contestant.profilePicURL}" alt="${contestant.artistName}">
                            <h3>${contestant.fullName}</h3>
                            <p><strong>Artist Name:</strong> ${contestant.artistName}</p>
                            <p><strong>Talent Category:</strong> ${contestant.talentCategory}</p>
                            <p><strong>Unique Code:</strong> ${contestant.uniqueCode}</p>
                            <p><strong>Votes:</strong> ${contestant.votes}</p>
                            <a href="https://wa.me/?text=${encodeURIComponent(`Vote for ${contestant.artistName}! Support me here: ${window.location.origin}/results.html#${contestant.uniqueCode}`)}"
                               target="_blank" class="whatsapp-btn">📲 Share on WhatsApp</a>
                        `;
                        categorySection.appendChild(card);
                    });
                    resultsContainer.appendChild(categorySection);
                });
            } catch (error) {
                console.error("Error fetching contestants:", error);
                resultsContainer.innerHTML = "<p>Failed to load results.</p>";
            }
        });
    </script>
</body>
</html>
